<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Rally Rivals Controller</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle at top,
            #183b50,
            #071016 70%
        );

    color: white;

    font-family:
        Arial,
        sans-serif;

    user-select: none;

}

.controller {

    width: 92%;

    max-width: 430px;

    padding: 28px 22px;

    border-radius: 22px;

    background:
        rgba(0,0,0,0.72);

    text-align: center;

}

h1 {

    margin: 0 0 8px;

}

#playerTitle {

    color: #4deaea;

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 20px;

}

#connection {

    padding: 12px;

    margin-bottom: 20px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

}

button {

    width: 100%;

    padding: 18px;

    margin-top: 12px;

    border: none;

    border-radius: 14px;

    font-size: 18px;

    font-weight: bold;

}

#motionButton {

    background: #4deaea;

}

#swingButton {

    background: #1976d2;

    color: white;

    font-size: 22px;

    padding: 25px;

}

.panel {

    margin-top: 20px;

    padding: 18px;

    border-radius: 14px;

    background:
        rgba(255,255,255,0.06);

}

#tiltValue {

    font-size: 25px;

    font-weight: bold;

    color: #4deaea;

}

#tiltBar {

    position: relative;

    width: 100%;

    height: 18px;

    margin-top: 15px;

    border-radius: 10px;

    background: #222;

}

#tiltIndicator {

    position: absolute;

    left: 50%;

    top: 3px;

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: #4deaea;

    transform:
        translateX(-50%);

}

#swing {

    margin-top: 10px;

    color: #aaa;

}

.instructions {

    margin-top: 20px;

    color: #aaa;

    line-height: 1.6;

    font-size: 13px;

}

#swingStatus {

    margin-top: 12px;

    color: #4deaea;

    font-size: 13px;

    font-weight: bold;

}

</style>

</head>


<body>

<div class="controller">

    <h1>🎾 Rally Rivals</h1>

    <div id="playerTitle">
        PLAYER
    </div>

    <div id="connection">
        Connecting...
    </div>

    <button id="motionButton">
        ENABLE MOTION
    </button>

    <div class="panel">

        <div>
            PHONE TILT
        </div>

        <div id="tiltValue">
            CENTER
        </div>

        <div id="tiltBar">

            <div id="tiltIndicator"></div>

        </div>

    </div>

    <button id="swingButton">
        🎾 SWING
    </button>

    <div id="swing">
        Last swing: None
    </div>

    <div id="swingStatus">
        Motion swing detection: OFF
    </div>

    <div class="instructions">

        Tilt LEFT / RIGHT to move.<br>

        Swing your phone to hit the ball.<br>

        The button can also be used as a backup.

    </div>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const player =
    Number(params.get("player")) === 2
        ? 2
        : 1;


document.getElementById(
    "playerTitle"
).textContent =
    "PLAYER " + player;


const connection =
    document.getElementById(
        "connection"
    );

const tiltValue =
    document.getElementById(
        "tiltValue"
    );

const tiltIndicator =
    document.getElementById(
        "tiltIndicator"
    );

const swingDisplay =
    document.getElementById(
        "swing"
    );

const swingStatus =
    document.getElementById(
        "swingStatus"
    );

const motionButton =
    document.getElementById(
        "motionButton"
    );

const swingButton =
    document.getElementById(
        "swingButton"
    );


/* =========================================================
   WEBSOCKET
========================================================= */

const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


const socket =
    new WebSocket(
        protocol +
        "//" +
        location.host
    );


socket.onopen = () => {

    connection.textContent =
        "🟢 CONNECTED";

    socket.send(
        JSON.stringify({
            type: "join",
            role: "controller",
            player: player
        })
    );

};


socket.onclose = () => {

    connection.textContent =
        "🔴 DISCONNECTED";

};


socket.onmessage = (event) => {

    try {

        const data =
            JSON.parse(
                event.data
            );


        if (
            data.type ===
            "player_full"
        ) {

            connection.textContent =
                "🔴 PLAYER SLOT FULL";

        }

    }
    catch (error) {

        console.error(
            error
        );

    }

};


/* =========================================================
   SEND DATA
========================================================= */

function send(data) {

    if (
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================================
   MOVEMENT
========================================================= */

function handleOrientation(
    event
) {

    let move =
        (event.gamma || 0) / 30;


    move =
        Math.max(
            -1,
            Math.min(
                1,
                move
            )
        );


    if (
        Math.abs(move) < 0.16
    ) {

        move = 0;

    }


    /*
        PLAYER 2 IS ON THE
        OPPOSITE SIDE OF THE COURT.

        Therefore their left/right
        direction needs to be reversed.
    */

    if (
        player === 2
    ) {

        move =
            -move;

    }


    if (move < -0.1) {

        tiltValue.textContent =
            "LEFT";

    }
    else if (move > 0.1) {

        tiltValue.textContent =
            "RIGHT";

    }
    else {

        tiltValue.textContent =
            "CENTER";

    }


    tiltIndicator.style.left =
        (
            50 +
            move * 45
        ) + "%";


    send({

        type: "move",

        player: player,

        x: move

    });

}


/* =========================================================
   MANUAL SWING
========================================================= */

function swing() {

    send({

        type: "swing",

        player: player,

        power: 1

    });


    swingDisplay.textContent =
        "Last swing: NOW";

}


/* =========================================================
   AUTOMATIC SWING DETECTION
========================================================= */

/*
    Phones report acceleration through
    device motion.

    We calculate the overall movement
    of the phone.

    A quick strong movement is treated
    as a tennis swing.
*/


let lastSwingDetection =
    0;


let swingCooldown =
    450;


function handleMotion(
    event
) {

    const acceleration =
        event.accelerationIncludingGravity;


    if (
        !acceleration
    ) {

        return;

    }


    const x =
        acceleration.x || 0;

    const y =
        acceleration.y || 0;

    const z =
        acceleration.z || 0;


    const magnitude =
        Math.sqrt(
            x * x +
            y * y +
            z * z
        );


    const now =
        Date.now();


    /*
        Around 9.8 m/s² is normal
        because of gravity.

        A strong movement should
        produce a significantly
        larger value.
    */

    const swingThreshold =
        22;


    if (
        magnitude >
        swingThreshold
    ) {

        if (
            now -
            lastSwingDetection <
            swingCooldown
        ) {

            return;

        }


        lastSwingDetection =
            now;


        swing();

        swingDisplay.textContent =
            "Last swing: DETECTED!";

    }

}


/* =========================================================
   ENABLE MOTION
========================================================= */

async function enableMotion() {

    try {

        /*
            iPhone / iPad permission
        */

        if (
            typeof DeviceOrientationEvent !==
            "undefined" &&
            typeof DeviceOrientationEvent.requestPermission ===
            "function"
        ) {

            const orientationPermission =
                await DeviceOrientationEvent.requestPermission();


            if (
                orientationPermission !==
                "granted"
            ) {

                alert(
                    "Motion permission denied."
                );

                return;

            }

        }


        /*
            Some iPhones also require
            permission for motion.
        */

        if (
            typeof DeviceMotionEvent !==
            "undefined" &&
            typeof DeviceMotionEvent.requestPermission ===
            "function"
        ) {

            const motionPermission =
                await DeviceMotionEvent.requestPermission();


            if (
                motionPermission !==
                "granted"
            ) {

                alert(
                    "Motion permission denied."
                );

                return;

            }

        }


        /*
            Movement
        */

        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );


        /*
            Swing detection
        */

        window.addEventListener(
            "devicemotion",
            handleMotion
        );


        motionButton.textContent =
            "✓ MOTION ENABLED";

        motionButton.style.background =
            "#45d483";


        swingStatus.textContent =
            "Motion swing detection: ON";


        swingStatus.style.color =
            "#45d483";


    }
    catch (error) {

        console.error(
            error
        );

        alert(
            "Could not enable motion."
        );

    }

}


/* =========================================================
   BUTTONS
========================================================= */

motionButton.addEventListener(
    "click",
    enableMotion
);


swingButton.addEventListener(
    "click",
    swing
);

</script>

</body>
</html>
